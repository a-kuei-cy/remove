<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>AI 智慧去背｜單張與批次</title>
<style>
:root{font-family:system-ui,"Noto Sans TC",sans-serif;color-scheme:dark;background:#0c1425;color:#edf4ff}*{box-sizing:border-box}body{margin:0;padding:24px}main{max-width:1080px;margin:auto}h1{margin:0 0 8px;font-size:clamp(25px,4vw,38px)}p{color:#b7c9e3;line-height:1.7}.panel{background:#17243a;border:1px solid #354b68;border-radius:18px;padding:22px;margin:18px 0}.drop{display:block;border:2px dashed #68b7ee;border-radius:16px;text-align:center;padding:32px 16px;cursor:pointer;background:#1a3049}.drop:focus-within,.drop:hover{background:#234261}.drop strong{font-size:20px}.drop input{position:absolute;width:1px;height:1px;opacity:0}.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-top:16px}button,.button{background:#3b96f0;color:white;border:0;border-radius:10px;padding:12px 17px;min-height:44px;font-weight:700;cursor:pointer;font-size:15px}button:disabled{opacity:.45;cursor:not-allowed}.secondary{background:#35475f}.good{background:#168b71}#status{min-height:25px;color:#c6e9ff}progress{width:100%;height:13px;accent-color:#4fd2a6}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:16px}.item{border:1px solid #344963;border-radius:14px;padding:13px;background:#111d30;min-width:0}.preview{display:grid;grid-template-columns:1fr 1fr;gap:8px}.preview figure{margin:0;min-width:0}.preview figcaption{font-size:12px;color:#c9d8ed;margin-bottom:6px}.preview img{width:100%;height:155px;object-fit:contain;border-radius:8px;background-color:#fff;background-image:linear-gradient(45deg,#cbd5e1 25%,transparent 25%),linear-gradient(-45deg,#cbd5e1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cbd5e1 75%),linear-gradient(-45deg,transparent 75%,#cbd5e1 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}.filename{font-size:13px;word-break:break-all;margin:9px 0}.state{color:#b8c9e2;font-size:13px;min-height:22px}.item button{width:100%;margin-top:8px}.tip{font-size:13px;color:#b9cde7}#drop.drag{border-color:#58e4b7;background:#234a51}button:focus-visible,.drop:focus-within{outline:3px solid #ffdc73;outline-offset:3px}@media(max-width:480px){body{padding:12px}.panel{padding:14px}.grid{grid-template-columns:1fr}}

.preview img{background-color:var(--preview-bg,#fff)}
.preview img[data-bg="black"]{background:#080b10}
.preview img[data-bg="white"]{background:#fff}
.preview img[data-bg="checker"]{background-color:#fff;background-image:linear-gradient(45deg,#cbd5e1 25%,transparent 25%),linear-gradient(-45deg,#cbd5e1 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#cbd5e1 75%),linear-gradient(-45deg,transparent 75%,#cbd5e1 75%);background-size:18px 18px;background-position:0 0,0 9px,9px -9px,-9px 0}
.settings{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:16px;margin:16px 0}.settings label{display:block;font-size:14px}.settings input[type=range]{width:100%;accent-color:#56baf5}.settings select{width:100%;min-height:44px;background:#253d5c;color:#fff;border:1px solid #6b87a5;border-radius:9px;padding:8px}.settings output{font-weight:700;color:#8ee6cf}

.editor{margin-top:12px;border-top:1px solid #405673;padding-top:12px}
.editor .tools{display:flex;flex-wrap:wrap;gap:7px;align-items:center}
.editor .tools button{font-size:13px;padding:8px 10px}
.editor .tools button.active{background:#1b9a7c}
.editor .tools input{width:90px}
.editor canvas{display:block;max-width:100%;height:auto;max-height:430px;touch-action:none;cursor:crosshair;border-radius:9px;margin:10px auto;background-color:#e5e7eb;background-image:linear-gradient(45deg,#b6c3d2 25%,transparent 25%),linear-gradient(-45deg,#b6c3d2 25%,transparent 25%),linear-gradient(45deg,transparent 75%,#b6c3d2 75%),linear-gradient(-45deg,transparent 75%,#b6c3d2 75%);background-size:20px 20px;background-position:0 0,0 10px,10px -10px,-10px 0}
.editor .hint{font-size:12px;color:#b7cde6}
</style></head><body><main>
<h1>AI 智慧圖片去背</h1>
<p>真正的 AI 主體分割，改善人物頭髮、複雜背景與深色輪廓。支援單張、批次、透明 PNG 匯出。</p>
<section class="panel">
<label class="drop" id="drop"><strong>點選或拖曳圖片到這裡</strong><p>JPG、PNG、WebP｜可一次選取多張</p><input id="files" type="file" accept="image/png,image/jpeg,image/webp" multiple></label>
<div class="settings">
<label>邊緣收縮 <output id="shrinkVal">1</output> px<input id="shrink" type="range" min="0" max="8" value="1"></label>
<label>邊緣柔化 <output id="featherVal">1</output> px<input id="feather" type="range" min="0" max="6" value="1"></label>
<label>預覽背景<select id="bg"><option value="checker">透明棋盤格</option><option value="black">黑色</option><option value="white">白色</option></select></label>
</div><p class="tip">調整滑桿會即時重新精修已完成的圖片，無須重新執行 AI。</p>
<div class="toolbar"><button id="run" disabled>開始 AI 去背</button><button id="downloadAll" class="good" disabled>下載全部成果</button><button id="clear" class="secondary" disabled>清除</button></div>
<p id="status" role="status" aria-live="polite">等待選取圖片。首次啟動 AI 需要網路下載模型，請耐心等候。</p><progress id="progress" max="100" value="0"></progress>
<p class="tip">隱私：圖片在瀏覽器內進行 AI 處理，不會由本工具上傳到自建伺服器。首次需要網路載入程式與模型；之後是否能離線使用取決於瀏覽器快取。批次下載時瀏覽器可能要求允許多檔下載。</p>
</section>
<section class="grid" id="results" aria-label="圖片清單"></section>
</main><script type="module">
const $=s=>document.querySelector(s), input=$('#files'), drop=$('#drop'), list=$('#results'), status=$('#status'), bar=$('#progress'), run=$('#run'), all=$('#downloadAll'), clear=$('#clear');
let items=[],busy=false,removeBackground=null;
const shrink=$('#shrink'),feather=$('#feather'),bg=$('#bg');
for(const [slider,out] of [[shrink,$('#shrinkVal')],[feather,$('#featherVal')]])slider.addEventListener('input',()=>{out.textContent=slider.value;refreshAll()});
bg.addEventListener('change',()=>document.querySelectorAll('.preview img').forEach(im=>im.dataset.bg=bg.value));
let revision=0;
function loadImage(url){return new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>resolve(im);im.onerror=reject;im.src=url})}
async function refine(item,version){
 if(!item.raw)return;
 const url=URL.createObjectURL(item.raw);
 try{
  const im=await loadImage(url),w=im.naturalWidth,h=im.naturalHeight;
  const canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;
  const ctx=canvas.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0);
  const data=ctx.getImageData(0,0,w,h),a=new Uint8Array(w*h);if(!item.originalPixels)item.originalPixels=await getOriginalPixels(item,w,h);
  for(let i=0;i<a.length;i++)a[i]=data.data[i*4+3];
  const radius=Number(shrink.value),soft=Number(feather.value);
  // Apply minimum filter to alpha only; RGB colors are never eroded.
  let eroded=a;
  if(radius>0){
   const temp=new Uint8Array(a.length);eroded=new Uint8Array(a.length);
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let v=255;for(let dx=-radius;dx<=radius;dx++){const xx=x+dx;if(xx<0||xx>=w){v=0;break}v=Math.min(v,a[y*w+xx])}
    temp[y*w+x]=v;
   }
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){
    let v=255;for(let dy=-radius;dy<=radius;dy++){const yy=y+dy;if(yy<0||yy>=h){v=0;break}v=Math.min(v,temp[yy*w+x])}
    eroded[y*w+x]=v;
   }
  }
  let result=eroded;
  if(soft>0){
   // Two-pass box blur for alpha channel.
   const temp=new Float32Array(a.length);result=new Uint8Array(a.length);
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let dx=-soft;dx<=soft;dx++){const xx=x+dx;if(xx>=0&&xx<w){s+=eroded[y*w+xx];n++}}temp[y*w+x]=s/n}
   for(let y=0;y<h;y++)for(let x=0;x<w;x++){let s=0,n=0;for(let dy=-soft;dy<=soft;dy++){const yy=y+dy;if(yy>=0&&yy<h){s+=temp[yy*w+x];n++}}result[y*w+x]=Math.round(s/n)}
  }
  // Preserve transparency in original input: never increase alpha over source.
  let sourceAlpha=null;
  if(item.originalHasAlpha){
   sourceAlpha=item.originalPixels;
  }
  for(let i=0;i<a.length;i++)data.data[i*4+3]=sourceAlpha?Math.min(result[i],sourceAlpha[i*4+3]):result[i];
  ctx.putImageData(data,0,0);
  // Save an unmodified AI-refined base; manual paint is applied on top.
  item.basePixels=new Uint8ClampedArray(data.data);
  item.width=w;item.height=h;
  applyPaint(item,ctx,data);
  const blob=await new Promise(res=>canvas.toBlob(res,'image/png'));
  if(version!==revision)return;
  if(item.out)URL.revokeObjectURL(item.out);
  item.blob=blob;item.out=URL.createObjectURL(blob);item.ui.im2.src=item.out;item.ui.im2.style.visibility='visible';item.ui.btn.disabled=false;drawEditor(item);
 }finally{URL.revokeObjectURL(url)}
}
function refreshAll(){const v=++revision;for(const item of items)if(item.raw)refine(item,v).catch(e=>console.error('精修失敗',e))}

const say=s=>{status.textContent=s}, update=()=>{run.disabled=busy||!items.some(x=>!x.blob);all.disabled=busy||!items.some(x=>x.blob);clear.disabled=busy||!items.length;input.disabled=busy};
function make(tag,cls,txt){const e=document.createElement(tag);if(cls)e.className=cls;if(txt!==undefined)e.textContent=txt;return e}
function addFiles(files){if(busy)return;for(const f of files){if(!/^image\/(png|jpeg|webp)$/.test(f.type))continue;const item={file:f,url:URL.createObjectURL(f),blob:null,raw:null,out:null,originalHasAlpha:f.type==='image/png'||f.type==='image/webp'};items.push(item);renderItem(item)}say(`已加入 ${items.length} 張圖片。按「開始 AI 去背」。`);update()}
function renderItem(item){const card=make('article','item'),name=make('div','filename',item.file.name),pv=make('div','preview'),state=make('div','state','等待處理'),btn=make('button','secondary','下載透明 PNG');btn.disabled=true;
const original=make('figure'),result=make('figure'),im1=make('img'),im2=make('img');im1.src=item.url;im1.alt='原始圖片';im1.dataset.bg=bg.value;im2.dataset.bg=bg.value;im2.alt='去背結果';im2.style.visibility='hidden';
for(const [fig,label,img] of [[original,'原圖',im1],[result,'AI 去背',im2]]){fig.append(make('figcaption','',label),img);pv.append(fig)}
btn.addEventListener('click',()=>{if(item.blob)download(item)});card.append(name,pv,state,btn);list.append(card);item.ui={state,btn,im2,card};const edit=make('div','editor');edit.hidden=true;card.append(edit);item.ui.editor=edit;const open=make('button','secondary','手動修補');open.disabled=true;open.addEventListener('click',()=>{edit.hidden=!edit.hidden;if(!edit.hidden){setupEditor(item);drawEditor(item)}open.textContent=edit.hidden?'手動修補':'收起修補工具'});card.append(open);item.ui.open=open}

// Manual brush stores strokes in normalized source-image coordinates.
function applyPaint(item,ctx,imageData){
 if(!item.strokes?.length)return;
 const mask=document.createElement('canvas');mask.width=item.width;mask.height=item.height;
 const mc=mask.getContext('2d');mc.lineCap='round';mc.lineJoin='round';
 for(const stroke of item.strokes){
  mc.globalCompositeOperation='source-over';mc.strokeStyle=stroke.mode==='keep'?'rgba(255,0,0,1)':'rgba(0,0,255,1)';
  mc.lineWidth=stroke.size;mc.beginPath();
  stroke.points.forEach((p,i)=>i?mc.lineTo(p.x,p.y):mc.moveTo(p.x,p.y));
  if(stroke.points.length===1){const q=stroke.points[0];mc.arc(q.x,q.y,0.01,0,Math.PI*2)}
  mc.stroke();
 }
 const marks=mc.getImageData(0,0,item.width,item.height).data;
 // Keep restores the original source RGB and alpha; erase sets alpha to 0.
 const src=item.originalPixels;
 for(let i=0;i<marks.length;i+=4){
  if(marks[i+3]===0)continue;
  if(marks[i]>marks[i+2]){if(src){imageData.data[i]=src[i];imageData.data[i+1]=src[i+1];imageData.data[i+2]=src[i+2];imageData.data[i+3]=src[i+3]}}
  else imageData.data[i+3]=0;
 }
 ctx.putImageData(imageData,0,0);
}
async function getOriginalPixels(item,w,h){
 const im=await loadImage(item.url),c=document.createElement('canvas');c.width=w;c.height=h;
 const ctx=c.getContext('2d',{willReadFrequently:true});ctx.drawImage(im,0,0,w,h);
 return ctx.getImageData(0,0,w,h).data;
}
function setupEditor(item){
 if(item.ui.canvas)return;
 const root=item.ui.editor,tools=make('div','tools');
 const keep=make('button','active','保留筆刷'),erase=make('button','secondary','擦除筆刷');
 const size=make('input');size.type='range';size.min='3';size.max='100';size.value='25';size.setAttribute('aria-label','筆刷大小');
 const undo=make('button','secondary','復原一筆'),reset=make('button','secondary','清除筆刷');
 const canvas=make('canvas');canvas.width=item.width;canvas.height=item.height;
 const hint=make('p','hint','在圖片上用手指或滑鼠塗抹。保留筆刷恢復原圖像素；擦除筆刷讓該區透明。');
 tools.append(keep,erase,make('span','','筆刷大小'),size,undo,reset);root.append(tools,canvas,hint);
 item.ui.canvas=canvas;item.ui.mode='keep';item.ui.size=size;
 const setMode=m=>{item.ui.mode=m;keep.className=m==='keep'?'active':'secondary';erase.className=m==='erase'?'active':'secondary'};
 keep.onclick=()=>setMode('keep');erase.onclick=()=>setMode('erase');
 undo.onclick=()=>{item.strokes?.pop();commitPaint(item)};
 reset.onclick=()=>{item.strokes=[];commitPaint(item)};
 const coords=e=>{const r=canvas.getBoundingClientRect();return {x:Math.max(0,Math.min(canvas.width,(e.clientX-r.left)/r.width*canvas.width)),y:Math.max(0,Math.min(canvas.height,(e.clientY-r.top)/r.height*canvas.height))}};
 let active=null;
 canvas.addEventListener('pointerdown',e=>{if(!item.basePixels)return;canvas.setPointerCapture(e.pointerId);active={mode:item.ui.mode,size:Number(size.value)*canvas.width/Math.max(200,canvas.clientWidth),points:[coords(e)]};item.strokes??=[];item.strokes.push(active);drawEditor(item)});
 canvas.addEventListener('pointermove',e=>{if(!active)return;active.points.push(coords(e));drawEditor(item)});
 const finish=()=>{if(!active)return;active=null;commitPaint(item)};
 canvas.addEventListener('pointerup',finish);canvas.addEventListener('pointercancel',finish);
}
function drawEditor(item){
 const c=item.ui.canvas;if(!c||!item.basePixels)return;
 const ctx=c.getContext('2d',{willReadFrequently:true});const data=new ImageData(new Uint8ClampedArray(item.basePixels),item.width,item.height);
 ctx.putImageData(data,0,0);applyPaint(item,ctx,data);
}
async function commitPaint(item){
 if(!item.basePixels)return;
 const c=document.createElement('canvas');c.width=item.width;c.height=item.height;
 const ctx=c.getContext('2d',{willReadFrequently:true}),data=new ImageData(new Uint8ClampedArray(item.basePixels),item.width,item.height);
 ctx.putImageData(data,0,0);applyPaint(item,ctx,data);
 const blob=await new Promise(res=>c.toBlob(res,'image/png'));
 if(item.out)URL.revokeObjectURL(item.out);
 item.blob=blob;item.out=URL.createObjectURL(blob);item.ui.im2.src=item.out;drawEditor(item);
}
function download(item){const a=document.createElement('a');a.href=item.out;a.download=item.file.name.replace(/\.[^.]+$/,'')+'_transparent.png';document.body.append(a);a.click();a.remove()}
async function loadEngine(){if(removeBackground)return removeBackground;say('正在載入 AI 引擎與模型，首次需要連網…');const mod=await import('https://cdn.jsdelivr.net/npm/@imgly/background-removal@1.5.8/+esm');if(typeof mod.removeBackground!=='function')throw Error('AI 模組載入失敗');removeBackground=mod.removeBackground;return removeBackground}
async function process(){if(busy)return;busy=true;update();const pending=items.filter(x=>!x.blob);let done=0;bar.value=0;try{const engine=await loadEngine();for(const item of pending){say(`AI 去背中：${item.file.name}（${done+1}/${pending.length}）`);item.ui.state.textContent='AI 處理中…';try{const blob=await engine(item.file,{progress:(key,current,total)=>{if(total>0)say(`模型載入／處理中：${item.file.name} · ${Math.round(current/total*100)}%`)}});item.raw=blob;await refine(item,revision);item.ui.state.textContent='完成 ✓';item.ui.open.disabled=false}catch(e){item.ui.state.textContent='失敗：'+(e.message||String(e));console.error(e)}done++;bar.value=done/pending.length*100}say(`處理結束：成功 ${pending.filter(x=>x.blob).length} / ${pending.length} 張。`)}catch(e){say('無法載入 AI 引擎：請確認已連網，或改用 Chrome／Edge。'+(e.message||''));console.error(e)}finally{busy=false;update()}}
run.addEventListener('click',process);all.addEventListener('click',()=>{items.filter(x=>x.blob).forEach((x,i)=>setTimeout(()=>download(x),i*300))});
clear.addEventListener('click',()=>{if(busy)return;for(const x of items){URL.revokeObjectURL(x.url);if(x.out)URL.revokeObjectURL(x.out)}items=[];list.replaceChildren();input.value='';bar.value=0;say('已清除，可重新選取圖片。');update()});
input.addEventListener('change',e=>addFiles(e.target.files));drop.addEventListener('dragover',e=>{e.preventDefault();drop.classList.add('drag')});drop.addEventListener('dragleave',()=>drop.classList.remove('drag'));drop.addEventListener('drop',e=>{e.preventDefault();drop.classList.remove('drag');addFiles(e.dataTransfer.files)});
</script></body></html>
